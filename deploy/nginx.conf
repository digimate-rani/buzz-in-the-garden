# Use this instead of Caddy if the server already runs nginx.
# Replace game.example.com with your domain, copy to /etc/nginx/sites-available/buzz,
# link it into sites-enabled, then:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d game.example.com     # adds HTTPS (required for offline mode)

server {
    listen 80;
    server_name game.example.com;
    root /var/www/buzz;
    index index.html;

    # Phones must always re-check these, otherwise game updates never arrive.
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / { try_files $uri $uri/ /index.html; }
}
